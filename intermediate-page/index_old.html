<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async PHP Processing</title>
    <style>
        /* Base page styling */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Intermediate Loading Overlay */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
        }

        .spinner {
            border: 4px solid f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Response Popup Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Main Form Page -->
    <div class="form-container">
        <h2>Process Data</h2>
        <form id="processForm">
            <input type="hidden" name="action" value="submit_data">
            <button type="submit" id="submitBtn">Submit Request</button>
        </form>
    </div>

    <!-- 1. Intermediate Processing Screen -->
    <div id="loadingOverlay" class="overlay">
        <div class="spinner"></div>
        <h2>Processing your request...</h2>
        <p>Please do not close this window.</p>
    </div>

    <!-- 2. Final Response Popup -->
    <div id="responseModal" class="modal">
        <div class="modal-content">
            <h3>Server Response</h3>
            <p id="responseText"></p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        document.getElementById('processForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop standard page reload

            const overlay = document.getElementById('loadingOverlay');
            const modal = document.getElementById('responseModal');
            const responseText = document.getElementById('responseText');
            
            // Step 1: Show the intermediate intermediate loading screen
            overlay.style.display = 'flex';

            // Gather form data
            const formData = new FormData(this);

            // Step 2: Send request to PHP backend
            fetch('process.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json()) // Expecting JSON back
            .then(data => {
                // Step 3: Hide intermediate screen, populate and show popup
                overlay.style.display = 'none';
                responseText.textContent = data.message;
                modal.style.display = 'flex';
            })
            .catch(error => {
                overlay.style.display = 'none';
                responseText.textContent = "An error occurred during processing.";
                modal.style.display = 'flex';
                console.error('Error:', error);
            });
        });

        function closeModal() {
            document.getElementById('responseModal').style.display = 'none';
        }
    </script>
</body>
</html>
